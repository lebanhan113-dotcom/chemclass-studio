function renderStudent(){root.innerHTML=`<div class="landing"><nav class="nav-landing">${logo()}<button class="btn btn-outline btn-sm" data-act="landing">← Trang chủ</button></nav><div style="max-width:900px;margin:38px auto;padding:0 19px" class="stack"><div class="hero"><span class="eyebrow">DÀNH CHO HỌC SINH</span><h2>${safe(settings.exam||'Phòng thi Hóa học')}</h2><p>Truy cập bài kiểm tra, nhập họ tên và lớp, làm bài trong thời gian quy định. Sau khi nộp bài, kết quả chỉ dành cho giáo viên.</p><button class="btn btn-primary" data-act="open-student-exam">BẮT ĐẦU VÀO PHÒNG THI ↗</button></div><div class="panel"><div class="panelhead"><div><h3>Đề thi hiện có</h3><p>Đề nguồn được sử dụng trong hệ thống</p></div><span class="tag">Hóa học</span></div><div class="exam-row"><div><b>${safe(settings.exam||'Đề GK1 Hóa học – nguồn gốc')}</b><div class="muted small">21 câu · 3 phần · ${settings.duration&&Number(settings.duration)>0?safe(settings.duration)+' phút':'Chưa cấu hình thời gian'}</div></div><button class="btn btn-primary btn-sm" data-act="open-student-exam">Vào làm bài</button></div><div class="notice warn" style="margin-top:16px">Với bản WebApp tĩnh, bài nộp của em được lưu trên trình duyệt và cần gửi phiếu JSON cho giáo viên để thu bài từ thiết bị khác.</div></div></div></div>`}
function renderTeacher(){let tabs={overview:'Tổng quan',classes:'Quản lý lớp',exams:'Đề thi',homework:'Bài tập',bank:'Ngân hàng câu hỏi',results:'Kết quả học sinh',reports:'Báo cáo',settings:'Cài đặt',room:'Phòng thi'};root.innerHTML=`<div class="app-shell"><aside class="sidebar ${navOpen?'show':''}" id="sidebar">${logo()}<div class="sidebar-section">QUẢN LÝ</div>${item('overview','Tổng quan')}${item('classes','Lớp học')}${item('exams','Đề kiểm tra')}${item('homework','Bài tập')}${item('bank','Ngân hàng câu hỏi')}<div class="sidebar-section">THEO DÕI</div>${item('results','Danh sách bài nộp')}${item('reports','Thống kê – báo cáo')}${item('room','Mở phòng thi')}${item('settings','Cài đặt')}<div class="sidebar-bottom"><button class="side-link" data-act="logout"><span class="glyph">⇥</span>Đăng xuất</button><div style="font-size:11px;color:#7897b7;padding:8px 13px">Phiên bản thử nghiệm · Lưu cục bộ</div></div></aside><div class="main-shell"><header class="topnav"><div class="right"><button class="btn btn-ghost mobile-menu" data-act="mobile-menu">☰</button><h1>${tabs[tab]}</h1></div><div class="right"><span class="small muted">${safe(settings.school||'Chưa thiết lập tên trường')}</span><span class="avatar">GV</span></div></header><main class="content" id="main-content">${({overview:pageOverview,classes:pageClasses,exams:pageExams,homework:pageHomework,bank:pageBank,results:pageResults,reports:pageReports,settings:pageSettings,room:pageRoom}[tab]||pageOverview)()}</main></div></div>`;}
function sectionTitle(s){return s==='I'?'Trắc nghiệm nhiều lựa chọn':s==='II'?'Trắc nghiệm Đúng/Sai':'Trắc nghiệm trả lời ngắn'}
function topTitle(head,subtitle,actions=''){return `<div class="pagetitle"><div><span class="eyebrow">CHEMCLASS STUDIO</span><h2>${head}</h2><p>${subtitle}</p></div>${actions?`<div class="action-row">${actions}</div>`:''}</div>`}
function submissions(){let raw=storeGet(KEY.submissions,[]);return Array.isArray(raw)?raw:[]}
function pageOverview(){const subs=submissions();const unique=[...new Set(subs.map(x=>x.className).filter(Boolean))];return topTitle('Chào mừng trở lại 👋','Quản lý mọi hoạt động dạy, học và kiểm tra trong một không gian.')+`<div class="stack"><section class="hero"><span class="eyebrow">LÀM VIỆC NHANH</span><h2>Phòng thi Hóa học đã có sẵn 21 câu hỏi</h2><p>Đề được trích từ file Word gốc. Bạn có thể duyệt ngân hàng, thiết lập thời gian, mở phòng thi và nhập phiếu bài nộp ngay.</p><div class="action-row"><button class="btn btn-primary" data-tab="room">Mở phòng thi →</button><button class="btn btn-outline" data-tab="bank">Duyệt 21 câu hỏi</button></div></section><div class="three"><div class="stat"><div class="stat-top">Lớp đã tạo <span class="stat-icon">▦</span></div><div class="stat-num">${classes.length}</div><div class="stat-foot">Danh sách lớp lưu tại máy này</div></div><div class="stat"><div class="stat-top">Câu hỏi gốc <span class="stat-icon">◈</span></div><div class="stat-num">${Q.length}</div><div class="stat-foot">Đủ ba phần theo tài liệu Word</div></div><div class="stat"><div class="stat-top">Bài đã ghi nhận <span class="stat-icon">▥</span></div><div class="stat-num">${subs.length}</div><div class="stat-foot">Trong trình duyệt hiện tại</div></div></div><div class="columns"><div class="panel"><div class="panelhead"><div><h3>Lối tắt công việc</h3><p>Chọn một tác vụ để bắt đầu</p></div></div><div class="stack" style="gap:11px"><div class="exam-row"><div><b>01. Tạo lớp</b><div class="muted small">Tạo danh sách lớp và học sinh</div></div><button class="btn btn-outline btn-sm" data-tab="classes">Mở →</button></div><div class="exam-row"><div><b>02. Kiểm tra đề</b><div class="muted small">Rà soát đáp án/công thức</div></div><button class="btn btn-outline btn-sm" data-tab="bank">Duyệt →</button></div><div class="exam-row"><div><b>03. Tổ chức thi</b><div class="muted small">Mở phòng thi và tạo link</div></div><button class="btn btn-outline btn-sm" data-tab="room">Mở →</button></div><div class="exam-row"><div><b>04. Thu bài & báo cáo</b><div class="muted small">Nhập phiếu JSON và xem danh sách</div></div><button class="btn btn-outline btn-sm" data-tab="results">Xem →</button></div></div></div><div class="panel"><div class="panelhead"><div><h3>Kiểm soát chất lượng đề gốc</h3><p>Những việc còn cần xác nhận</p></div><span class="tag tag-amber">Cần rà soát</span></div><div class="stack" style="gap:15px"><div class="notice-line"><b>Câu I-12</b><div>Đề có nhiều phương án thỏa mãn thứ tự bán kính nguyên tử.</div></div><div class="notice-line"><b>Câu II-02</b><div>Rà soát tên muối sodium iodate và lượng khí chlorine.</div></div><div class="notice-line"><b>Biểu điểm & quy ước màu</b><div>Chưa được xác nhận trong nguồn; không tự tạo thang điểm.</div></div></div><div class="divider"></div><button class="btn btn-primary btn-sm" data-act="open-exam-teacher">Mở khu vực duyệt đáp án ↗</button></div></div></div>`}
function pageClasses(){const total=classes.reduce((n,c)=>n+(c.students||[]).length,0);return topTitle('Lớp học','Tạo lớp, quản lý học sinh và nhập danh sách từ CSV.',`<button class="btn btn-primary" data-act="new-class">＋ Tạo lớp mới</button>`)+`<div class="three"><div class="stat"><div class="stat-top">Số lớp<span class="stat-icon">▦</span></div><div class="stat-num">${classes.length}</div></div><div class="stat"><div class="stat-top">Học sinh trong danh sách<span class="stat-icon">◉</span></div><div class="stat-num">${total}</div></div><div class="stat"><div class="stat-top">Bài đã nộp<span class="stat-icon">▥</span></div><div class="stat-num">${submissions().length}</div></div></div><div style="height:17px"></div><div class="panel"><div class="panelhead"><div><h3>Danh sách lớp</h3><p>Chưa có lớp mặc định; chỉ dùng lớp giáo viên tự tạo</p></div></div>${classes.length?`<div class="three">${classes.map(c=>`<div class="group-card"><div class="action-row"><span class="tag">${safe(c.grade||'Lớp học')}</span><span class="tag tag-muted">${(c.students||[]).length} học sinh</span></div><div class="group-title">${safe(c.name)}</div><span class="small muted">${safe(c.year||'Chưa ghi năm học')}</span><div class="action-row"><button class="btn btn-primary btn-sm" data-act="class-view" data-id="${safe(c.id)}">Quản lý lớp →</button><button class="btn btn-danger btn-sm" data-act="class-remove" data-id="${safe(c.id)}">Xóa</button></div></div>`).join('')}</div>`:`<div class="empty"><div class="emicon">▦</div><strong>Chưa tạo lớp học</strong><p>Bắt đầu bằng nút “Tạo lớp mới”.</p><button class="btn btn-primary btn-sm" data-act="new-class">＋ Tạo lớp</button></div>`}</div>`}
function pageExams(){return topTitle('Đề kiểm tra','Kho đề thi thật đã có, giữ nguyên nội dung và số thứ tự gốc.',`<button class="btn btn-outline" data-act="download-source">⬇ Xuất dữ liệu đề gốc</button>`)+`<div class="panel"><div class="panelhead"><div><h3>Danh sách đề</h3><p>Không tạo đề giả hoặc tự suy đoán đáp án</p></div><span class="tag tag-green">01 đề nguồn</span></div><div class="exam-row"><div><span class="tag">HÓA HỌC</span><div class="group-title" style="margin:7px 0">${safe(settings.exam||'Đề kiểm tra GK1 – Hóa học (nguồn Word)')}</div><div class="muted small">21 câu · Phần I: 15 · Phần II: 2 · Phần III: 4</div><div class="muted small">Thời gian: ${settings.duration&&Number(settings.duration)>0?safe(settings.duration)+' phút':'Chưa thiết lập'}</div></div><div class="action-row"><button class="btn btn-primary" data-tab="room">Tổ chức thi →</button><button class="btn btn-outline" data-tab="bank">Xem câu hỏi</button></div></div><div class="notice warn" style="margin-top:19px"><b>Lưu ý chuyên môn:</b> Đề có 2 câu cần rà soát; đáp án theo dấu màu chưa được xác nhận chính thức. Vào khu vực giáo viên của mô-đun phòng thi để cấu hình biểu điểm trước khi công bố điểm.</div></div>`}
function pageHomework(){return topTitle('Bài tập','Soạn nhiệm vụ và quản lý các bài tập giáo viên đã tạo.',`<button class="btn btn-primary" data-act="new-homework">＋ Tạo bài tập</button>`)+`<div class="panel"><div class="panelhead"><div><h3>Nhiệm vụ học tập</h3><p>Bài tập được lưu cục bộ; xuất phiếu JSON để chuyển sang thiết bị khác.</p></div><span class="tag">${homework.length} bài tập</span></div>${homework.length?`<div class="stack" style="gap:12px">${homework.map(h=>`<div class="exam-row"><div style="min-width:0"><div class="strong">${safe(h.title)}</div><div class="small muted">Lớp: ${safe(classes.find(c=>c.id===h.classId)?.name||'Chưa chọn')} · Hạn nộp: ${safe(h.deadline?new Date(h.deadline).toLocaleString('vi-VN'):'Chưa quy định')}</div><div class="small muted" style="max-width:700px;white-space:pre-wrap">${safe(h.note)}</div></div><div class="action-row"><button class="btn btn-outline btn-sm" data-act="export-homework" data-id="${safe(h.id)}">Xuất phiếu</button><button class="btn btn-danger btn-sm" data-act="remove-homework" data-id="${safe(h.id)}">Xóa</button></div></div>`).join('')}</div>`:`<div class="empty"><div class="emicon">◫</div><strong>Chưa có bài tập được tạo</strong><p>Tạo nhiệm vụ học tập đầu tiên cho một lớp.</p><button class="btn btn-primary btn-sm" data-act="new-homework">＋ Tạo bài tập</button></div>`}<div class="notice" style="margin-top:15px">Để học sinh nộp file hoặc bài tự luận trực tiếp trên Internet cần thêm tài khoản, nơi lưu file và cơ sở dữ liệu trung tâm.</div></div>`}
function pageBank(){const list=Q.filter(q=>(qtype==='all'||q.section_id===qtype)&&(!qsearch||[q.id,q.stem.text,q.options?.map(x=>x.text).join(' ')||'',q.statements?.map(x=>x.text).join(' ')||''].join(' ').toLocaleLowerCase('vi').includes(qsearch.toLocaleLowerCase('vi'))));return topTitle('Ngân hàng câu hỏi','Tra cứu và đối chiếu đủ 21 câu từ file Word gốc.',`<button class="btn btn-outline" data-act="download-source">⬇ Xuất ngân hàng JSON</button>`)+`<div class="three"><div class="stat"><div class="stat-top">Trắc nghiệm<span class="stat-icon">◉</span></div><div class="stat-num">15</div></div><div class="stat"><div class="stat-top">Đúng – Sai<span class="stat-icon">☑</span></div><div class="stat-num">2</div></div><div class="stat"><div class="stat-top">Trả lời ngắn<span class="stat-icon">▤</span></div><div class="stat-num">4</div></div></div><div style="height:18px"></div><div class="panel"><div class="filters"><div class="searchbar"><span>⌕</span><input id="bank-search" placeholder="Tìm theo nội dung, nguyên tố, mã câu..." value="${safe(qsearch)}" aria-label="Tìm kiếm câu hỏi"></div><select id="bank-filter" aria-label="Lọc theo phần"><option value="all" ${qtype==='all'?'selected':''}>Tất cả các phần</option><option value="I" ${qtype==='I'?'selected':''}>Phần I · 15 câu</option><option value="II" ${qtype==='II'?'selected':''}>Phần II · 2 câu</option><option value="III" ${qtype==='III'?'selected':''}>Phần III · 4 câu</option></select></div><div class="small muted" style="margin-bottom:14px">Hiển thị ${list.length} / 21 câu</div><div id="bank-list">${list.length?list.map(q=>`<div class="question-card"><div class="action-row" style="justify-content:space-between"><span class="question-label">${safe(q.id)} · ${sectionTitle(q.section_id)}</span><span>${qmeta[q.id]?.level?`<span class="tag">${safe(qmeta[q.id].level)}</span>`:''}${q.issues?.length?'<span class="tag tag-amber">Cần rà soát</span>':''}</span></div><div class="q-preview">${safe(q.stem.text.replace(/\[\[media:[^\]]+\]\]/g,'').replace(/\s+/g,' ').slice(0,230))}${q.stem.text.length>230?'…':''}</div><div class="action-row"><button class="btn btn-outline btn-sm" data-act="question-detail" data-id="${safe(q.id)}">Xem nguyên câu →</button><span class="small muted">Nguồn trang ${q.source_pages.join(', ')}</span></div></div>`).join(''):`<div class="empty">Không tìm thấy câu hỏi phù hợp.</div>`}</div></div>`}
function pageResults(){const subs=submissions();return topTitle('Danh sách bài nộp','Dữ liệu thực đã được nộp hoặc nhập vào trình duyệt giáo viên.',`<button class="btn btn-outline" data-act="export-result-csv">⬇ Xuất CSV</button><button class="btn btn-primary" data-act="open-exam-teacher">Nhập phiếu / Chấm bài ↗</button>`)+`<div class="panel"><div class="panelhead"><div><h3>Bài làm học sinh</h3><p>Số bài trong bộ nhớ trình duyệt: ${subs.length}</p></div><span class="tag">Lưu trên máy này</span></div>${subs.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Họ tên</th><th>Lớp</th><th>Thời điểm nộp</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody>${subs.slice().reverse().map((s,i)=>`<tr><td><b>${safe(s.name||'Chưa có tên')}</b></td><td>${safe(s.className||'—')}</td><td>${safe(formatDate(s.submittedAt))}</td><td><span class="tag tag-amber">Cần xác nhận điểm</span></td><td><button class="btn btn-outline btn-sm" data-act="open-exam-teacher">Mở</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="emicon">▤</div><strong>Chưa có bài nộp trong bộ nhớ hiện tại</strong><p>Nhập phiếu JSON trong khu vực giáo viên của phòng thi để ghi nhận bài từ máy học sinh.</p><button class="btn btn-primary btn-sm" data-act="open-exam-teacher">Nhập bài nộp →</button></div>`}<div class="notice warn" style="margin-top:19px">Không thể đọc bài nộp trên máy học sinh từ trình duyệt này nếu chưa có backend. Điểm chính thức chỉ hiển thị sau khi giáo viên xác nhận đáp án và biểu điểm trong mô-đun phòng thi.</div></div>`}

function questionHTML(q){const b=q.stem?.blocks?.length?q.stem.blocks:[{segments:[{type:'text',value:q.stem.text}]}];let s=b.map(x=>(x.segments||[]).map(p=>p.type==='media'?`<img class="q-img" src="${safe(MEDIA[p.media_id]||'')}" alt="Công thức từ đề gốc: ${safe(p.media_id)}">`:safe(p.value)).join('')).filter(Boolean).map(x=>`<p style="margin:9px 0">${x}</p>`).join('');if(q.type==='multiple_choice')s+='<div>'+q.options.map(o=>`<div class="q-opt"><b>${safe(o.label)}.</b><div>${(o.segments||[{type:'text',value:o.text}]).map(x=>x.type==='media'?`<img class="q-img" src="${safe(MEDIA[x.media_id]||'')}" alt="Ký hiệu nguyên tử từ đề gốc">`:safe(x.value)).join('')}</div></div>`).join('')+'</div>';if(q.type==='true_false')s+=q.statements.map(st=>`<div class="statement"><b>${safe(st.label)})</b> ${safe(st.text)}</div>`).join('');return s}

function roomURL(){let u=new URL('exam.html',location.href);u.searchParams.set('portal','student');let minutes=Number(settings.duration);if(Number.isInteger(minutes)&&minutes>0&&minutes<=1000){u.searchParams.set('room',JSON.stringify({school:settings.school||'',teacher:settings.teacher||'',exam:settings.exam||'',duration:minutes,shuffleQuestions:!!settings.shuffleQuestions,shuffleOptions:!!settings.shuffleOptions}));}return u.href}

function sha256Standalone(bytes){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const msg=Array.from(bytes);const bitLength=BigInt(bytes.length)*8n;msg.push(128);while(msg.length%64!==56)msg.push(0);for(let i=7;i>=0;i--)msg.push(Number((bitLength>>BigInt(i*8))&255n));const R=(n,k)=>(n>>>k)|(n<<(32-k));
 for(let off=0;off<msg.length;off+=64){const w=new Uint32Array(64);for(let i=0;i<16;i++){const p=off+i*4;w[i]=((msg[p]<<24)|(msg[p+1]<<16)|(msg[p+2]<<8)|msg[p+3])>>>0}for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];const s0=R(a,7)^R(a,18)^(a>>>3),s1=R(b,17)^R(b,19)^(b>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
 let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=R(a,2)^R(a,13)^R(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}for(let i=0;i<8;i++)H[i]=(H[i]+[a,b,c,d,e,f,g,h][i])>>>0}
 return H.map(x=>x.toString(16).padStart(8,'0')).join('')
}
async function hashPass(pass){const enc=new TextEncoder().encode(PASS_SALT+'\0'+pass);if(crypto?.subtle){const dig=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(dig),x=>x.toString(16).padStart(2,'0')).join('')}return sha256Standalone(enc)}
function switchTab(t){tab=t;navOpen=false;render();window.scrollTo({top:0,behavior:'instant'})}
root.addEventListener('click',async(e)=>{const a=e.target.closest('[data-tab],[data-act]');if(!a)return;if(a.dataset.tab){switchTab(a.dataset.tab);return}let x=a.dataset.act;switch(x){case 'landing':mode='landing';render();break;case 'go-student':mode='student';render();break;case 'login':modalLogin();break;case 'logout':teacher=false;mode='landing';tab='overview';render();toast('Đã đăng xuất khỏi khu vực giáo viên.');break;case 'mobile-menu':navOpen=!navOpen;render();break;case 'new-class':modalCreateClass();break;case 'class-view':{let c=classes.find(x=>x.id===a.dataset.id);if(c)modalClassDetail(c);break}case 'class-remove':{let c=classes.find(x=>x.id===a.dataset.id);if(c&&confirm('Xóa lớp '+c.name+' và danh sách học sinh đã lưu ở máy này?')){classes=classes.filter(x=>x.id!==c.id);storeSet(KEY.classes,classes);render()}break}case 'new-homework':modalHomework();break;case 'remove-homework':if(confirm('Xóa bài tập đã tạo?')){homework=homework.filter(h=>h.id!==a.dataset.id);storeSet(KEY.homework,homework);render()}break;case 'export-homework':{let h=homework.find(x=>x.id===a.dataset.id);if(h)download('bai_tap_'+h.id+'.json',JSON.stringify({type:'chemclass-homework-v1',item:h},null,2));break}case 'question-detail':modalQuestion(a.dataset.id);break;case 'open-exam-teacher':openExam(true);break;case 'open-student-exam':openExam(false);break;case 'copy-link':{let u=roomURL();try{await navigator.clipboard.writeText(u);toast('Đã sao chép link. Lưu ý: cần tải web lên hosting để chia sẻ được.')}catch(_){showModal(modalHeader('Link phòng thi')+`<textarea class="input" readonly>${safe(u)}</textarea>`)}break}case 'download-source':download('ngan_hang_hoa_hoc_21_cau.json',JSON.stringify(ALL,null,2));break;case 'export-result-csv':exportSubmissions();break;case 'backup':backup();break;}});
overlay.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a){let x=a.dataset.act;if(x==='close-modal')closeModal();else if(x==='export-class'){const c=classes.find(z=>z.id===a.dataset.id);if(c)exportStudents(c)}else if(x==='remove-student'){const c=classes.find(z=>z.id===a.dataset.id);if(c&&confirm('Xóa học sinh khỏi danh sách lớp?')){c.students=c.students.filter(x=>x.id!==a.dataset.sid);storeSet(KEY.classes,classes);modalClassDetail(c)}}}else if(e.target.id==='dialogback')closeModal()});
document.addEventListener('change',async e=>{if(e.target.id==='bank-filter'){qtype=e.target.value;render();}if(e.target.id==='togglePass'){let x=document.getElementById('loginPass');if(x)x.type=e.target.checked?'text':'password'}if(e.target.id==='restore-file'){const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.schema!=='chemclass-backup-v1'||!Array.isArray(d.classes)||!Array.isArray(d.homework)||!Array.isArray(d.submissions)||typeof d.qmeta!=='object')throw Error('Sai định dạng');if(!confirm('Khôi phục dữ liệu sẽ ghi đè lớp, bài tập và bài nộp hiện tại. Tiếp tục?'))return;classes=d.classes;homework=d.homework;qmeta=d.qmeta;storeSet(KEY.classes,classes);storeSet(KEY.homework,homework);storeSet(KEY.qmeta,qmeta);storeSet(KEY.submissions,d.submissions);toast('Đã khôi phục dữ liệu.');render();}catch(err){alert('Không thể khôi phục: '+err.message)}}if(e.target.id==='csv-students'){const c=classes.find(x=>x.id===e.target.dataset.id);const f=e.target.files?.[0];if(!c||!f)return;try{const txt=(await f.text()).replace(/^\ufeff/,'').trim();const rows=txt.split(/\r?\n/).filter(Boolean).map(x=>x.split(/[;,]/).map(y=>y.trim().replace(/^"|"$/g,'')));if(rows.length&&/^(họ|ho |name|ten)/i.test(rows[0][0]))rows.shift();let added=0;for(const r of rows){if(!r[0]||r[0].length>100)continue;c.students.push({id:id(),name:r[0],code:(r[1]||'').slice(0,40)});added++}storeSet(KEY.classes,classes);modalClassDetail(c);toast('Đã thêm '+added+' học sinh.')}catch(err){alert('Không thể đọc CSV: '+err.message)}}});
document.addEventListener('input',e=>{if(e.target.id==='bank-search'){qsearch=e.target.value;const pos=e.target.selectionStart;render();let el=document.getElementById('bank-search');el?.focus();el?.setSelectionRange(pos,pos)}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.id)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));if(f.id==='loginForm'){const target=f.querySelector('#loginError');try{const hash=await hashPass(d.loginPass||f.querySelector('#loginPass').value);if(hash===(localStorage.getItem(KEY.pass)||PASS_HASH_INITIAL)){teacher=true;mode='teacher';tab='overview';closeModal();render();toast('Đăng nhập thành công.')}else{target.textContent='Passcode không chính xác.';}}catch(err){target.textContent='Không thể kiểm tra passcode.'}return}if(f.id==='classForm'){let name=String(d.name||'').trim();if(!name)return;if(classes.some(c=>c.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'))){alert('Tên lớp đã tồn tại.');return}classes.push({id:id(),name,grade:String(d.grade||'').trim(),year:String(d.year||'').trim(),students:[]});storeSet(KEY.classes,classes);closeModal();render();toast('Đã tạo lớp '+name);return}if(f.id==='addStudentForm'){let c=classes.find(c=>c.id===d.classId),name=String(d.name||'').trim();if(!c||!name)return;c.students.push({id:id(),name,code:String(d.code||'').trim()});storeSet(KEY.classes,classes);modalClassDetail(c);toast('Đã thêm học sinh.');return}if(f.id==='homeworkForm'){let title=String(d.title||'').trim(),note=String(d.note||'').trim();if(!title||!note)return;homework.push({id:id(),title,classId:String(d.classId||''),deadline:String(d.deadline||''),note,createdAt:now()});storeSet(KEY.homework,homework);closeModal();render();toast('Đã lưu bài tập.');return}if(f.id==='qmetaForm'){qmeta[d.qid]={level:String(d.level||''),topic:String(d.topic||'')};storeSet(KEY.qmeta,qmeta);closeModal();render();toast('Đã lưu phân loại câu hỏi.');return}if(f.id==='settingsForm'){let min=Number(d.duration);if(!Number.isInteger(min)||min<1||min>1000){alert('Thời gian phải từ 1 đến 1000 phút.');return}settings={...settings,school:String(d.school||'').trim().slice(0,150),teacher:String(d.teacher||'').trim().slice(0,150),exam:String(d.exam||'').trim().slice(0,150),duration:String(min)};storeSet(KEY.settings,settings);render();toast('Đã lưu cài đặt phòng thi.');return}});
render();
</script></body></html>
