// Cấu hình chia sẻ qua URL chỉ gồm thông tin công khai của phòng thi, KHÔNG chứa đáp án hay passcode.
function roomSettingsFromUrl(){
 try{
  const raw=new URLSearchParams(location.search).get('room');
  if(!raw||raw.length>4000)return {};
  const obj=JSON.parse(raw);
  if(!obj||typeof obj!=='object'||Array.isArray(obj))return {};
  const d=Number(obj.duration);
  if(!Number.isInteger(d)||d<1||d>1000)return {};
  const safeText=x=>typeof x==='string'?x.slice(0,150):'';
  return {school:safeText(obj.school),teacher:safeText(obj.teacher),exam:safeText(obj.exam),duration:String(d),shuffleQuestions:obj.shuffleQuestions===true,shuffleOptions:obj.shuffleOptions===true};
 }catch(_){return {}}
}
function roomLink(){
 if(location.protocol==='file:'||!(Number(settings.duration)>0))return '';
 const url=new URL(location.href);url.search='';url.hash='';
 const value={school:settings.school,teacher:settings.teacher,exam:settings.exam,duration:Number(settings.duration),shuffleQuestions:!!settings.shuffleQuestions,shuffleOptions:!!settings.shuffleOptions};
 url.searchParams.set('room',JSON.stringify(value));
 return url.href;
}
function shareHTML(){
 const link=roomLink();
 return '<div class="line"></div><h4>LINK PHÒNG THI CHO HỌC SINH</h4>'+
 '<p class="small muted">Liên kết mang theo tên trường, kỳ thi, thời gian và tùy chọn đảo câu. Hãy LƯU CÀI ĐẶT trước khi tạo link. Logo tải lên chỉ lưu trên máy này.</p>'+
 (link?'<div class="field"><label>Liên kết chia sẻ</label><textarea readonly rows="3" aria-label="Liên kết cho học sinh">'+esc(link)+'</textarea></div><button class="btn btn-primary" data-action="copy-room-link">Sao chép link phòng thi</button>':'<div class="notice">Cần thiết lập thời gian và đăng tải WebApp lên HTTPS trước khi tạo link chia sẻ.</div>')+
 '<div class="notice">LƯU Ý: Bài nộp không chuyển về giáo viên, không đồng bộ giữa thiết bị. Đây là bản demo WebApp tĩnh, KHÔNG tổ chức thi có chấm điểm tập trung.</div>';
}

const QUESTION_BY_ID=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));

const DEFAULT_SETTINGS={school:'',teacher:'',exam:'',duration:'',logo:'',shuffleQuestions:false,shuffleOptions:false};
const readJSON=(name,fallback)=>{try{const j=JSON.parse(localStorage.getItem(name));return j===null?fallback:j}catch(_){return fallback}};
const saveJSON=(name,value)=>localStorage.setItem(name,JSON.stringify(value));

const esc=(s)=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const attr=esc;
const count=QUESTIONS.length;
function fullAnswered(q,answers){if(q.type==='true_false')return q.statements.every(s=>['ĐÚNG','SAI'].includes(answers[q.id+'_'+s.label]));return !!String(answers[q.id]??'').trim()}
function partAnswered(q,answers){if(q.type==='true_false')return q.statements.some(s=>!!answers[q.id+'_'+s.label]);return !!String(answers[q.id]??'').trim()}
function progress(answers){const done=QUESTIONS.filter(q=>fullAnswered(q,answers)).length; const partial=QUESTIONS.filter(q=>partAnswered(q,answers)&&!fullAnswered(q,answers)).length;return {done,partial,empty:count-done-partial}}
function mediaMarkup(id){const a=MEDIA[id]; if(!a)return '<span class="pill bad">Thiếu tài nguyên '+esc(id)+'</span>';return '<img class="media '+(id==='image5'?'reaction':'')+'" src="'+a+'" alt="Công thức từ Word gốc: '+esc(id)+'">'}
function segmentsMarkup(segments){return (segments||[]).map((s,i)=>{if(s.type==='media')return mediaMarkup(s.media_id);if(s.type==='text'&&s.value==='.'&&segments[i-1]?.type==='media'&&segments[i-1]?.media_id==='image5')return '';return esc(s.value)}).join('')}
function stemMarkup(q){return (q.stem?.blocks||[]).map(b=>{if(!b.segments||!b.segments.length)return '';const body=segmentsMarkup(b.segments);return body.trim()?'<p>'+body+'</p>':''}).join('')||esc(q.stem?.text)}
function optionMarkup(opt){return opt.segments?segmentsMarkup(opt.segments):esc(opt.text)}
function markOf(q){return q.answer?.source_formatting_candidate||q.answer?.tentative_true_false_from_color||null}
function logoHTML(){return settings.logo?'<img class="brand-logo" src="'+settings.logo+'" alt="Logo trường">':'<div class="logo-placeholder" aria-label="Chưa cài logo">✧</div>'}
function paintHeader(){const hide=route==='studentDone';header.style.display=hide?'none':'flex';header.innerHTML=logoHTML()+'<div class="brand" style="flex:1"><div><h1>'+esc(settings.school||'PHÒNG THI HÓA HỌC')+'</h1><small>'+esc(settings.exam||'Tên kỳ thi chưa thiết lập')+' · Môn Hóa học</small></div></div><div class="header-right">'+(route.startsWith('teacher')?'KHU VỰC GIÁO VIÊN':route.startsWith('student')?'KHU VỰC HỌC SINH':'BẢN DEMO WEB · DỮ LIỆU CỤC BỘ')+'</div>'}

ady?'disabled':'')+'>BẮT ĐẦU LÀM BÀI</button><button class="btn btn-secondary btn-block" type="button" data-action="recover-receipt" style="margin-top:10px">Tải lại phiếu bài nộp của em</button><p class="small muted">Để lấy lại phiếu trên thiết bị này, nhập đúng họ tên và lớp đã dùng rồi nhấn nút trên. Không hiển thị bài của người khác.</p></form></div>'}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newDraft(name,className){const bySection=['I','II','III'].map(sec=>{const a=QUESTIONS.filter(q=>q.section_id===sec).map(q=>q.id);return settings.shuffleQuestions?shuffle(a):a});const order=bySection.flat();const opts={};for(const q of QUESTIONS.filter(x=>x.type==='multiple_choice'))opts[q.id]=settings.shuffleOptions?shuffle(q.options.map(o=>o.label)):q.options.map(o=>o.label);const now=Date.now();return {id:now+'_'+Math.random().toString(36).slice(2,8),name,className,startedAt:new Date(now).toISOString(),endAt:now+Number(settings.duration)*60000,duration:Number(settings.duration),answers:{},flags:{},order,optionsOrder:opts,active:0}}
function draftSave(){if(draft)try{saveJSON(STORAGE.draft,draft)}catch(e){alert('Không thể lưu tạm trong trình duyệt. Kiểm tra chế độ riêng tư hoặc dung lượng lưu trữ.')}}
function timerText(){if(!draft)return '--:--';const diff=Math.max(0,Math.ceil((draft.endAt-Date.now())/1000));const h=Math.floor(diff/3600),m=Math.floor((diff%3600)/60),s=diff%60;return (h?h.toString().padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function currentQuestion(){if(!draft)return QUESTIONS[0];const id=draft.order[draft.active];return QUESTION_BY_ID[id]||QUESTIONS[0]}
function navButtonsHTML(){return ['I','II','III'].map(sec=>{const ids=draft.order.filter(id=>QUESTION_BY_ID[id].section_id===sec);return '<section class="nav-section"><strong>'+esc(sectionTitles[sec])+'</strong><div class="number-grid">'+ids.map(id=>{const q=QUESTION_BY_ID[id],a=fullAnswered(q,draft.answers)?'done':partAnswered(q,draft.answers)?'partial':'',isCurrent=draft.order[draft.active]===id?'current':'',flag=draft.flags[id]?'flagged':'';return '<button class="num-btn '+a+' '+isCurrent+' '+flag+'" data-action="jump-question" data-id="'+id+'" title="Phần '+sec+' câu '+q.number+'">'+q.number+'</button>'}).join('')+'</div></section>'}).join('')}
function renderExam(){if(!draft){nav('studentStart');return}if(Date.now()>=draft.endAt){finish(true);return}const q=currentQuestion(),p=progress(draft.answers);const isMC=q.type==='multiple_choice';let body='';if(isMC){const opts=(draft.optionsOrder[q.id]||q.options.map(o=>o.label)).map(label=>q.options.find(o=>o.label===label)).filter(Boolean);body=opts.map((opt,i)=>{const selected=draft.answers[q.id]===opt.label;return '<label class="option '+(selected?'selected':'')+'"><input type="radio" name="mcanswer" value="'+esc(opt.label)+'" '+(selected?'checked':'')+'><span class="optlabel">'+String.fromCharCode(65+i)+'.</span><span class="option-content">'+optionMarkup(opt)+'</span></label>'}).join('')}else if(q.type==='true_false'){body=q.statements.map(s=>'<div class="tf-row"><div class="tf-text"><strong>'+esc(s.label)+')</strong> '+optionMarkup(s)+'</div><div class="tf-choices">'+['ĐÚNG','SAI'].map(v=>'<label><input type="radio" name="tf_'+esc(s.label)+'" value="'+v+'" '+(draft.answers[q.id+'_'+s.label]===v?'checked':'')+'> '+(v==='ĐÚNG'?'Đúng':'Sai')+'</label>').join('')+'</div></div>').join('')}else if(q.type==='short_answer'){body='<div class="field"><label for="shortAnswer">Nhập câu trả lời</label><input id="shortAnswer" data-question="'+q.id+'" value="'+attr(draft.answers[q.id]||'')+'" placeholder="Nhập kết quả"></div>'}else if(q.type==='essay'){body='<div class="field"><label for="essayAnswer">Bài làm tự luận</label><textarea id="essayAnswer" data-question="'+q.id+'">'+esc(draft.answers[q.id]||'')+'</textarea></div>'}
app.innerHTML='<div class="sectionhead"><div><h2 class="page-title">Bài thi Hóa học</h2><div class="subtext">'+esc(draft.name)+' · Lớp '+esc(draft.className)+' · '+esc(settings.exam||'Kỳ thi chưa đặt tên')+'</div></div><div class="timer" id="examTimer" aria-live="polite">'+timerText()+'</div></div><div class="exam-layout"><div><article class="card question-card"><div class="exam-head"><div><div class="question-label">'+esc(sectionTitles[q.section_id])+'</div><h3>Câu '+q.number+' <span class="muted small">· '+(draft.active+1)+'/21</span></h3></div><span class="pill">'+(isMC?'Nhiều lựa chọn':q.type==='true_false'?'Đúng / Sai':q.type==='short_answer'?'Trả lời ngắn':'Tự luận')+'</span></div><div class="question-stem">'+stemMarkup(q)+'</div>'+body+'<div class="question-footer"><label class="review"><input type="checkbox" id="flagCurrent" '+(draft.flags[q.id]?'checked':'')+'> ⚑ Đánh dấu cần xem lại</label><span class="small muted">Đã hoàn thành '+p.done+'/21 câu</span></div></article><div class="button-row" style="justify-content:space-between;margin-top:18px"><button class="btn btn-secondary" data-action="prev" '+(draft.active===0?'disabled':'')+'>← Câu trước</button><button class="btn btn-secondary" data-action="next" '+(draft.active===20?'disabled':'')+'>Câu tiếp theo →</button></div></div><aside class="card nav-panel"><div class="nav-title">Danh sách câu hỏi</div><div class="small muted">Đã làm '+p.done+' · Đang làm '+p.partial+' · Chưa làm '+p.empty+'</div>'+navButtonsHTML()+'<div class="line"></div><div class="legend"><span><b class="dot done"></b>Hoàn thành</span><span><b class="dot partial"></b>Chưa đủ ý</span><span><b class="dot flagged"></b>Cần xem lại</span></div><div class="line"></div><button class="btn btn-primary btn-block" data-action="submit">NỘP BÀI</button><div class="small muted" style="margin-top:10px">Bài làm tự lưu trên trình duyệt này. Hết giờ sẽ tự nộp.</div></aside></div>'
}
function renderDone(){app.innerHTML='<section class="confirm-done"><div class="big-check">✓</div><h2>ĐÃ NỘP BÀI THÀNH CÔNG!</h2><p>Bài làm của em đã được ghi nhận.</p></section>'}
function renderLogin(){app.innerHTML='<div class="card" style="max-width:520px;margin:32px auto"><h2 class="page-title center">ĐĂNG NHẬP QUẢN LÝ PHÒNG THI</h2><p class="small muted center">Chế độ thử nghiệm trên trình duyệt cục bộ</p><form id="teacherLoginForm" style="margin-top:22px"><div class="field"><label for="teacherPass">Nhập passcode</label><div class="togglepass"><input id="teacherPass" type="password" autocomplete="off" spellcheck="false" required><button type="button" data-action="toggle-pass" data-target="teacherPass">Hiện</button></div></div><div id="loginError" class="small" role="alert" style="color:var(--red)">'+esc(teacherError)+'</div><div class="button-row" style="margin-top:17px"><button class="btn btn-primary" type="submit">ĐĂNG NHẬP</button><button class="btn btn-secondary" data-action="home" type="button">QUAY LẠI</button></div></form></div>'}
function renderTeacher(){if(!teacherAuth){nav('teacherLogin');return}const items=[['overview','Tổng quan'],['students','Danh sách học sinh'],['keys','Đáp án & biểu điểm'],['settings','Cài đặt'],['password','Đổi passcode']];app.innerHTML='<div class="sectionhead"><div><h2 class="page-title">Dashboard giáo viên</h2><div class="subtext">Quản lý cục bộ · '+esc(settings.teacher||'Chưa đặt tên giáo viên')+'</div></div><button class="btn btn-secondary" data-action="logout">ĐĂNG XUẤT</button></div><div class="teacher-shell"><nav class="card teacher-nav" aria-label="Khu vực giáo viên">'+items.map(i=>'<button data-action="teacher-tab" data-tab="'+i[0]+'" class="'+(teacherTab===i[0]?'active':'')+'">'+i[1]+'</button>').join('')+'</nav><section id="teacherContent">'+teacherContent()+'</section></div>'}
function teacherContent(){return teacherTab==='overview'?overviewHTML():teacherTab==='students'?studentsHTML():teacherTab==='keys'?keysHTML():teacherTab==='settings'?settingsHTML():passwordHTML()}
function attempts(){return readJSON(STORAGE.attempts,[])}
function validation(q){const k=rubric[q.id]||{};if(q.type==='multiple_choice')return ['A','B','C','D'].includes(k.key)&&finitePositive(k.points);
 if(q.type==='short_answer')return q.answer?.confirmed&&finitePositive(k.points);
 if(q.type==='true_false'){if(!q.statements.every(s=>['ĐÚNG','SAI'].includes(k.keys?.[s.label])))return false; if(k.mode==='by_count')return [0,1,2,3,4].every(i=>finiteNonnegative(k.countPoints?.[i]));return q.statements.every(s=>finiteNonnegative(k.itemPoints?.[s.label]))&&q.statements.some(s=>Number(k.itemPoints[s.label])>0)}
 if(q.type==='essay')return finitePositive(k.points);return false}
function finitePositive(x){return x!==null&&x!==undefined&&String(x).trim()!==''&&Number.isFinite(Number(x))&&Number(x)>0}
function finiteNonnegative(x){return x!==null&&x!==undefined&&String(x).trim()!==''&&Number.isFinite(Number(x))&&Number(x)>=0}
function maxPoints(q,k){return q.type==='true_false'?(k.mode==='by_count'?Math.max(...[0,1,2,3,4].map(i=>Number(k.countPoints[i]))):q.statements.reduce((s,x)=>s+Number(k.itemPoints[x.label]),0)):Number(k.points)}
function gradeAttempt(a){let score=0,max=0,graded=0,pending=0,correct=0,wrong=0,unanswered=0,waitingEssay=0;const details=[];for(const q of QUESTIONS){const k=rubric[q.id]||{},ready=validation(q),answered=fullAnswered(q,a.answers||{}),partial=partAnswered(q,a.answers||{});let obtained=null,possible=ready?maxPoints(q,k):null,right=null,correctParts=null,markStatus='chua-cham';if(!partial){unanswered++;markStatus='chua-tra-loi'}else if(q.type==='essay'){const manual=a.manualGrades?.[q.id];if(ready&&finiteNonnegative(manual)&&Number(manual)<=possible){obtained=Number(manual);right=null;markStatus='da-cham-tu-luan'}else{waitingEssay++;markStatus='cho-cham'}}else if(ready){if(q.type==='multiple_choice'){right=a.answers[q.id]===k.key;obtained=right?possible:0}else if(q.type==='short_answer'){right=String(a.answers[q.id]||'').trim()===String(q.answer.value).trim();obtained=right?possible:0}else if(q.type==='true_false'){correctParts=q.statements.filter(s=>a.answers[q.id+'_'+s.label]===k.keys[s.label]).length;right=correctParts===4;obtained=k.mode==='by_count'?Number(k.countPoints[correctParts]):q.statements.reduce((s,x)=>s+(a.answers[q.id+'_'+x.label]===k.keys[x.label]?Number(k.itemPoints[x.label]):0),0)}markStatus='da-cham';if(right)correct++;else wrong++}else{pending++;markStatus='cho-dap-an-bieu-diem'}
 if(ready){max+=possible;if(obtained!==null){score+=obtained;graded++}}
 details.push({q,answered,partial,ready,obtained,possible,right,correctParts,markStatus})}
 const complete=QUESTIONS.every(q=>validation(q))&&waitingEssay===0;const issueConfirmed=['I-12','II-02'].every(id=>!!rubric._reviewed?.[id]);const official=complete&&issueConfirmed;return {score,max,graded,pending,correct,wrong,unanswered,waitingEssay,official,details}}
function gradeLabel(g){return g.official?'Chính thức':g.graded?'Tạm tính':'Chưa đủ biểu điểm'}
function num(x){return Number(x).toLocaleString('vi-VN',{maximumFractionDigits:4})}
function overviewHTML(){const data=attempts(),scores=data.map(gradeAttempt),official=scores.filter(x=>x.official);return '<div class="card"><h3>Tổng quan phòng thi</h3><div class="info-grid"><div class="info"><div class="big">'+data.length+'</div><div class="desc">Lượt nộp cục bộ</div></div><div class="info"><div class="big">'+(official.length?num(official.reduce((s,x)=>s+x.score,0)/official.length):'—')+'</div><div class="desc">Điểm TB (bài chính thức)</div></div><div class="info"><div class="big">'+QUESTIONS.filter(validation).length+'/21</div><div class="desc">Câu đã đủ cấu hình chấm</div></div></div>'+classStatisticsHTML(data)+'<div class="notice">Nguồn A1 chưa có thang điểm; 15 câu nhiều lựa chọn và 2 câu Đúng/Sai mới có dấu hiệu đáp án theo màu. Kết quả chỉ được coi là chính thức sau khi giáo viên tự xác nhận đáp án, biểu điểm và hai câu cần rà soát.</div><div class="button-row"><button class="btn btn-primary" data-action="teacher-tab" data-tab="keys">Duyệt đáp án & biểu điểm</button><button class="btn btn-secondary" data-action="teacher-tab" data-tab="students">Xem bài nộp</button></div></div>'}
function studentsHTML(){const data=attempts();return '<div class="card"><div class="sectionhead"><div><h3 style="margin:0">Bài đã nộp</h3><div class="small muted">Dữ liệu trong trình duyệt này và các phiếu JSON được giáo viên nhập thủ công. Không có đồng bộ nhiều thiết bị.</div></div><button class="btn btn-primary" data-action="export-excel" '+(!data.length?'disabled':'')+'>⬇ Xuất Excel (.xlsx)</button><div class="result-actions"><label class="file-pick" title="Chọn nhiều phiếu bài nộp JSON">⬆ Nhập phiếu bài nộp <input id="importAttemptFiles" type="file" accept=".json,application/json" multiple aria-label="Chọn các tệp bài nộp JSON"></label><button type="button" class="btn btn-secondary btn-sm" data-action="backup-data">Sao lưu dữ liệu</button><label class="file-pick" title="Khôi phục dữ liệu sao lưu">Khôi phục bản sao <input id="restoreBackupFile" type="file" accept=".json,application/json" aria-label="Chọn bản sao lưu JSON"></label></div></div><div class="field"><label for="studentFilter">Tìm tên hoặc lớp</label><input id="studentFilter" placeholder="Tìm trong bài đã nộp"></div><div class="table-wrap"><table><thead><tr><th>Họ và tên</th><th>Lớp</th><th>Nộp lúc</th><th>Điểm</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody id="attemptRows">'+rowsHTML(data)+'</tbody></table></div></div>'+(selectedAttempt?detailHTML(data.find(a=>a.id===selectedAttempt)):'')}
function rowsHTML(data){return data.length?data.slice().reverse().map(a=>{const g=gradeAttempt(a);return '<tr data-row-name="'+attr((a.name+' '+a.className).toLowerCase())+'"><td>'+esc(a.name)+'</td><td>'+esc(a.className)+'</td><td>'+dateFmt(a.submittedAt)+'</td><td>'+(g.graded?num(g.score)+' / '+num(g.max):'—')+'</td><td><span class="pill '+(g.official?'ok':'warn')+'">'+gradeLabel(g)+'</span></td><td><button class="btn btn-light btn-sm" data-action="view-attempt" data-id="'+attr(a.id)+'">Xem</button></td></tr>'}).join(''):'<tr><td colspan="6"><div class="no-records">Chưa có lượt thi nào được nộp trong trình duyệt này.</div></td></tr>'}
function dateFmt(x){try{return new Date(x).toLocaleString('vi-VN')}catch(_){return '—'}}
function answerOf(a,q){if(q.type==='multiple_choice'){const value=a.answers?.[q.id];const option=q.options.find(o=>o.label===value);return value?(value+'. '+(option?.text||'')):'Chưa trả lời'}if(q.type==='true_false')return q.statements.map(s=>s.label+') '+(a.answers?.[q.id+'_'+s.label]||'—')).join(' · ');return a.answers?.[q.id]||'Chưa trả lời'}
function keyOf(q){const k=rubric[q.id]||{};if(q.type==='multiple_choice')return validation(q)?k.key:'Chưa duyệt';if(q.type==='true_false')return validation(q)?q.statements.map(s=>s.label+') '+k.keys[s.label]).join(' · '):'Chưa duyệt';if(q.type==='short_answer')return q.answer?.confirmed?String(q.answer.value):'Chưa có';return 'Chờ chấm'}

tails>').join('')+'</div>'}

function extractRubric(){const form=document.getElementById('rubricForm'),r={_reviewed:{}};const get=(key)=>form.elements.namedItem(key)?.value??'';for(const q of QUESTIONS){const k={};if(q.type==='multiple_choice'){k.key=get('key_'+q.id);k.points=get('point_'+q.id)}else if(q.type==='short_answer'||q.type==='essay'){k.points=get('point_'+q.id)}else if(q.type==='true_false'){k.keys={};k.itemPoints={};k.countPoints={};for(const s of q.statements){k.keys[s.label]=get('key_'+q.id+'_'+s.label);k.itemPoints[s.label]=get('item_'+q.id+'_'+s.label)}for(let i=0;i<=4;i++)k.countPoints[i]=get('count_'+q.id+'_'+i);k.mode=get('mode_'+q.id)}r[q.id]=k}r._reviewed['I-12']=!!form.elements.namedItem('review_I-12')?.checked;r._reviewed['II-02']=!!form.elements.namedItem('review_II-02')?.checked;return r}

function finish(automatic=false){if(!draft||route==='studentDone')return;const p=progress(draft.answers);if(!automatic&&!confirm('Xác nhận NỘP BÀI? Đã làm đủ '+p.done+'/21 câu. Sau khi nộp không thể sửa bài.'))return;const attempt={id:draft.id,name:draft.name,className:draft.className,answers:draft.answers,flags:draft.flags,order:draft.order,optionsOrder:draft.optionsOrder,startedAt:draft.startedAt,submittedAt:new Date().toISOString(),duration:draft.duration,autoSubmitted:automatic,manualGrades:{}};try{const all=attempts();if(!all.some(a=>a.id===attempt.id)){all.push(attempt);saveJSON(STORAGE.attempts,all)}localStorage.removeItem(STORAGE.draft);draft=null;registerLocalReceipt(attempt.id);route='studentDone';render();try{downloadReceipt(attempt)}catch(ex){console.warn('Trình duyệt chặn tải phiếu bài nộp:',ex)}}catch(e){alert('Chưa thể ghi bài vào bộ nhớ trình duyệt. Kiểm tra dung lượng localStorage trước khi nộp.') }}

function sha256Standalone(bytes){

 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const msg=Array.from(bytes);const bitLength=BigInt(bytes.length)*8n;msg.push(128);while(msg.length%64!==56)msg.push(0);for(let i=7;i>=0;i--)msg.push(Number((bitLength>>BigInt(i*8))&255n));const R=(n,k)=>(n>>>k)|(n<<(32-k));
 for(let off=0;off<msg.length;off+=64){const w=new Uint32Array(64);for(let i=0;i<16;i++){const p=off+i*4;w[i]=((msg[p]<<24)|(msg[p+1]<<16)|(msg[p+2]<<8)|msg[p+3])>>>0}for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];const s0=R(a,7)^R(a,18)^(a>>>3),s1=R(b,17)^R(b,19)^(b>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
 let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=R(a,2)^R(a,13)^R(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}for(let i=0;i<8;i++)H[i]=(H[i]+[a,b,c,d,e,f,g,h][i])>>>0}
 return H.map(x=>x.toString(16).padStart(8,'0')).join('')
}
async function hashPass(s){const bytes=new TextEncoder().encode(PASS_SALT+'\x00'+s);if(window.crypto?.subtle){const dig=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(dig),b=>b.toString(16).padStart(2,'0')).join('')}return sha256Standalone(bytes)}

// XLSX exporter: SpreadsheetML wrapped in an uncompressed ZIP with CRC32 (standalone, no CDN).
const enc=new TextEncoder();
function crc32(bytes){let crc=~0;for(const byte of bytes){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return (~crc)>>>0}
function zipBytes(files){const local=[],central=[];let offset=0;const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];for(const [name,content]of files){const nm=enc.encode(name),bytes=enc.encode(content),crc=crc32(bytes);const head=Uint8Array.from([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(nm.length),...u16(0),...nm]);local.push(head,bytes);const cent=Uint8Array.from([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nm]);central.push(cent);offset+=head.length+bytes.length}const centerLen=central.reduce((s,x)=>s+x.length,0),end=Uint8Array.from([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centerLen),...u32(offset),...u16(0)]);return new Blob([...local,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function excelCol(n){let r='';for(let x=n+1;x>0;x=Math.floor((x-1)/26))r=String.fromCharCode(65+(x-1)%26)+r;return r}
function excelSheet(rows){return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="17"/><sheetData>'+rows.map((row,r)=>'<row r="'+(r+1)+'">'+row.map((cell,c)=>{const ref=excelCol(c)+(r+1);return typeof cell==='number'&&Number.isFinite(cell)?'<c r="'+ref+'"><v>'+cell+'</v></c>':'<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xml(cell)+'</t></is></c>'}).join('')+'</row>').join('')+'</sheetData></worksheet>'}
function exportExcel(){const as=attempts();if(!as.length){alert('Chưa có bài để xuất.');return}const header=['Họ và tên','Lớp','Kỳ thi','Thời gian bắt đầu','Thời gian nộp','Thời gian làm bài (giây)','Điểm','Điểm tối đa có thể chấm','Trạng thái điểm','Số câu đúng','Số câu sai','Chưa trả lời','Chưa chấm','Tự luận chờ chấm','Mã bài'];const rows=[header,...as.map(a=>{const g=gradeAttempt(a);return [a.name,a.className,settings.exam||'',dateFmt(a.startedAt),dateFmt(a.submittedAt),Math.max(0,Math.round((new Date(a.submittedAt)-new Date(a.startedAt))/1000)),g.graded?g.score:'',g.graded?g.max:'',gradeLabel(g),g.correct,g.wrong,g.unanswered,g.pending,g.waitingEssay,a.id]})];const book='<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Bang diem" sheetId="1" r:id="rId1"/></sheets></workbook>';const rels='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';const root='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';const ct='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';const blob=zipBytes([['[Content_Types].xml',ct],['_rels/.rels',root],['xl/workbook.xml',book],['xl/_rels/workbook.xml.rels',rels],['xl/worksheets/sheet1.xml',excelSheet(rows)]]);const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='bang_diem_hoa_hoc_'+new Date().toISOString().slice(0,10)+'.xlsx';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500)}
async function uploadLogo(file){if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){alert('Vui lòng chọn ảnh PNG/JPEG/WebP/GIF.');return}if(file.size>3e6){alert('Ảnh quá lớn. Vui lòng dùng ảnh nhỏ hơn 3 MB.');return}const url=URL.createObjectURL(file),pic=new Image();pic.onload=()=>{const scale=Math.min(1,250/pic.width,250/pic.height),can=document.createElement('canvas');can.width=Math.max(1,Math.round(pic.width*scale));can.height=Math.max(1,Math.round(pic.height*scale));can.getContext('2d').drawImage(pic,0,0,can.width,can.height);const data=can.toDataURL('image/png');URL.revokeObjectURL(url);settings.logo=data;const preview=document.getElementById('logoPreview');if(preview)preview.innerHTML='<img src="'+data+'" alt="Logo">';};pic.onerror=()=>{URL.revokeObjectURL(url);alert('Không thể đọc ảnh logo.');};pic.src=url}

// Version 2: manual file exchange for devices without a shared online database.
// Import does NOT authenticate the submitting student or verify anti-cheat claims.
const SUBMISSION_FORMAT='hoa-hoc-submission-v2';
const BACKUP_FORMAT='hoa-hoc-backup-v2';
const SOURCE_DIGEST='c070b3f76f7369ad9439e70d8ca980eaccf2bbb7c3e3aef6c8c86099f9411bd4';
function saveBlob(blob,filename){
 const url=URL.createObjectURL(blob),el=document.createElement('a');
 el.href=url;el.download=filename;el.style.display='none';document.body.appendChild(el);el.click();el.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2500);
}
function saveAsJson(data,filename){saveBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),filename)}
function safeFilename(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,46)||'hoc_sinh'}
function receiptPayload(a){
 return {format:SUBMISSION_FORMAT,source_sha256:SOURCE_DIGEST,exportedAt:new Date().toISOString(),
  warning:'Du lieu cục bộ học sinh xuất ra, chưa có chữ ký số hoặc xác thực máy chủ.',
  attempt:{id:a.id,name:a.name,className:a.className,answers:a.answers,flags:a.flags,order:a.order,
  optionsOrder:a.optionsOrder,startedAt:a.startedAt,submittedAt:a.submittedAt,duration:a.duration,autoSubmitted:a.autoSubmitted}};
}
function downloadReceipt(a){saveAsJson(receiptPayload(a),'Phieu_nop_'+safeFilename(a.name)+'_'+safeFilename(a.className)+'_'+safeFilename(a.id)+'.json')}
function normalizeImportedAttempt(payload){
 if(!payload||payload.format!==SUBMISSION_FORMAT||payload.source_sha256!==SOURCE_DIGEST)throw Error('Phiếu không đúng phiên bản hoặc không khớp đề Hóa học gốc.');
 const a=payload.attempt;if(!a||typeof a!=='object'||Array.isArray(a))throw Error('Không tìm thấy thông tin bài làm.');
 const nonempty=(v,max)=>typeof v==='string'&&v.trim().length>0&&v.length<=max;
 if(!nonempty(a.id,100)||!nonempty(a.name,180)||!nonempty(a.className,100))throw Error('Thiếu mã bài, họ tên hoặc lớp hợp lệ.');
 if(!Number.isFinite(Date.parse(a.startedAt))||!Number.isFinite(Date.parse(a.submittedAt)))throw Error('Ngày làm/nộp bài không hợp lệ.');
 if(!Number.isFinite(Number(a.duration))||Number(a.duration)<1||Number(a.duration)>1000)throw Error('Thời gian làm bài không hợp lệ.');
 if(!a.answers||typeof a.answers!=='object'||Array.isArray(a.answers))throw Error('Thiếu dữ liệu câu trả lời.');
 const answers={},flags={};
 for(const q of QUESTIONS){
  if(q.type==='true_false'){
   for(const st of q.statements){const key=q.id+'_'+st.label,v=a.answers[key];if(v===undefined||v===null||v==='')continue;if(!['ĐÚNG','SAI'].includes(v))throw Error('Phát hiện giá trị Đúng/Sai không hợp lệ.');answers[key]=v}
  }else{const v=a.answers[q.id];if(v===undefined||v===null||v==='')continue;
   if(q.type==='multiple_choice'){if(!q.options.some(o=>o.label===v))throw Error('Phương án chọn không hợp lệ.');answers[q.id]=v}
   else if(typeof v==='string'&&v.length<=20000)answers[q.id]=v;
   else throw Error('Câu trả lời quá dài hoặc không hợp lệ.');
  }
  if(a.flags?.[q.id]===true)flags[q.id]=true;
 }
 const allQ=QUESTIONS.map(q=>q.id);
 const order=Array.isArray(a.order)&&a.order.length===count&&new Set(a.order).size===count&&a.order.every(id=>QUESTION_BY_ID[id])?a.order:allQ;
 const optionsOrder={};for(const q of QUESTIONS.filter(q=>q.type==='multiple_choice')){
  const labels=q.options.map(o=>o.label),given=a.optionsOrder?.[q.id];
  optionsOrder[q.id]=Array.isArray(given)&&given.length===labels.length&&new Set(given).size===labels.length&&given.every(v=>labels.includes(v))?given:labels;
 }
 return {id:a.id,name:a.name.trim(),className:a.className.trim(),answers,flags,order,optionsOrder,
 startedAt:new Date(a.startedAt).toISOString(),submittedAt:new Date(a.submittedAt).toISOString(),duration:Number(a.duration),
 autoSubmitted:a.autoSubmitted===true,manualGrades:{},source:'phiếu nhập thủ công – không xác thực danh tính'};
}
function registerLocalReceipt(id){try{const ids=readJSON(STORAGE.localReceiptIds,[]);if(!ids.includes(id)){ids.push(id);saveJSON(STORAGE.localReceiptIds,ids.slice(-30))}}catch(e){console.warn('Không thể ghi mã phiếu cục bộ',e)}}
function recoverReceipt(){
 const name=document.getElementById('studentName')?.value.trim(),cls=document.getElementById('studentClass')?.value.trim();
 if(!name||!cls){alert('Hãy nhập đúng họ tên và lớp đã dùng khi làm bài.');return}
 const key=x=>String(x||'').normalize('NFC').trim().toLocaleLowerCase('vi');
 const allowed=new Set(readJSON(STORAGE.localReceiptIds,[]));
 const rows=attempts().filter(a=>allowed.has(a.id)&&key(a.name)===key(name)&&key(a.className)===key(cls));
 const last=rows.sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)))[0];
 if(!last){alert('Không tìm thấy phiếu bài nộp của họ tên và lớp này trên thiết bị. Nếu đã xóa dữ liệu trình duyệt, phiếu không thể khôi phục cục bộ.');return}
 downloadReceipt(last);
}
async function importReceiptFiles(files){
 if(!teacherAuth){alert('Hãy đăng nhập giáo viên.');return}
 const list=Array.from(files||[]);if(!list.length)return;
 if(list.length>200){alert('Chỉ nhập tối đa 200 phiếu mỗi lượt.');return}
 const current=attempts(),ids=new Set(current.map(a=>a.id));let added=0,dupes=0;const failures=[];
 for(const f of list){
  try{
   if(f.size>1024*1024)throw Error('Tệp vượt quá 1 MB.');
   const obj=JSON.parse(await f.text());const candidate=normalizeImportedAttempt(obj);
   if(ids.has(candidate.id)){dupes++;continue}ids.add(candidate.id);current.push(candidate);added++;
  }catch(err){failures.push(f.name+': '+err.message)}
 }
 if(added){try{saveJSON(STORAGE.attempts,current)}catch(err){alert('Không thể lưu các bài nhập: '+err.message);return}}
 selectedAttempt=null;renderTeacher();
 alert('Đã nhập: '+added+' bài. Trùng mã: '+dupes+'. Tệp lỗi: '+failures.length+(failures.length?'\n'+failures.slice(0,8).join('\n')+(failures.length>8?'\n…':''):''));
}
function exportBackup(){
 if(!teacherAuth)return;
 const all=attempts();const payload={format:BACKUP_FORMAT,version:2,source_sha256:SOURCE_DIGEST,
 generatedAt:new Date().toISOString(),settings:{...settings,logo:settings.logo||''},rubric,attempts:all,
 notice:'Có thông tin học sinh và đáp án. Không gửi công khai. Không chứa passcode giáo viên.'};
 saveAsJson(payload,'Sao_luu_phong_thi_Hoa_hoc_'+new Date().toISOString().slice(0,10)+'.json');
}
async function restoreBackup(file){
 if(!teacherAuth||!file)return;
 if(file.size>8*1024*1024){alert('Bản sao lưu vượt quá 8MB.');return}
 let payload;
 try{payload=JSON.parse(await file.text());if(payload.format!==BACKUP_FORMAT||payload.source_sha256!==SOURCE_DIGEST||!Array.isArray(payload.attempts))throw Error('Không đúng định dạng sao lưu phòng thi này.');}
 catch(err){alert('Không mở được bản sao lưu: '+err.message);return}
 const sanitized=[];const ids=new Set();
 try{for(const x of payload.attempts){const a=normalizeImportedAttempt({format:SUBMISSION_FORMAT,source_sha256:SOURCE_DIGEST,attempt:x});if(ids.has(a.id))continue;ids.add(a.id);a.manualGrades={};if(x.manualGrades&&typeof x.manualGrades==='object')for(const q of QUESTIONS.filter(q=>q.type==='essay')){const val=x.manualGrades[q.id];if(finiteNonnegative(val))a.manualGrades[q.id]=Number(val)}sanitized.push(a)}}
 catch(err){alert('Bản sao lưu có bài không hợp lệ: '+err.message);return}
 if(!confirm('Khôi phục '+sanitized.length+' bài. Bài có mã trùng được giữ phiên bản hiện có; cài đặt và đáp án sẽ bị thay bằng bản sao lưu. Bạn đã sao lưu dữ liệu hiện tại chưa?'))return;
 const merged=attempts();const have=new Set(merged.map(a=>a.id));for(const a of sanitized)if(!have.has(a.id))merged.push(a);
 const nextSetting={...DEFAULT_SETTINGS};for(const k of ['school','teacher','exam','duration','logo']){const v=payload.settings?.[k];if(typeof v==='string'){if(k==='logo')nextSetting[k]=/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(v)&&v.length<=280000?v:'';else nextSetting[k]=v.slice(0,200)}}
 nextSetting.shuffleQuestions=payload.settings?.shuffleQuestions===true;nextSetting.shuffleOptions=payload.settings?.shuffleOptions===true;
 // Rubric is teacher-entered, never imported from student receipts.
 const nextRubric=(payload.rubric&&typeof payload.rubric==='object'&&!Array.isArray(payload.rubric))?payload.rubric:{};
 try{saveJSON(STORAGE.attempts,merged);saveJSON(STORAGE.settings,nextSetting);saveJSON(STORAGE.rubric,nextRubric);
 settings=nextSetting;rubric=nextRubric;selectedAttempt=null;renderTeacher();alert('Đã khôi phục '+sanitized.length+' bài trong tệp, trong đó '+(merged.length-have.size)+' bài mới.');}
 catch(err){alert('Không thể lưu bản sao: '+err.message)}
}
function classStatisticsHTML(data){
 if(!data.length)return '';
 const groups=new Map();for(const a of data){const cl=a.className||'Chưa có lớp';if(!groups.has(cl))groups.set(cl,[]);groups.get(cl).push(a)}
 const rows=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'vi')).map(([cl,items])=>{
  const scores=items.map(gradeAttempt),official=scores.filter(x=>x.official),mean=official.length?num(official.reduce((sum,g)=>sum+g.score,0)/official.length):'—';
  return '<tr><td>'+esc(cl)+'</td><td>'+items.length+'</td><td>'+official.length+'</td><td>'+mean+'</td></tr>'
 }).join('');
 return '<div class="class-stats"><h4>Thống kê theo lớp (dữ liệu thực tế đã nhập)</h4><div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Lượt nộp</th><th>Bài đủ chấm chính thức</th><th>Điểm TB chính thức</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

// One event delegation layer for all screens.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
 if(action==='student-open')nav('studentStart');else if(action==='teacher-open'){teacherError='';nav('teacherLogin')}else if(action==='home')nav('home');else if(action==='resume-draft'){if(draft){route='studentExam';render()}}else if(action==='prev')goToQuestion(draft.active-1);else if(action==='next')goToQuestion(draft.active+1);else if(action==='jump-question')goToQuestion(draft.order.indexOf(b.dataset.id));else if(action==='submit')finish(false);else if(action==='logout'){teacherAuth=false;selectedAttempt=null;nav('home')}else if(action==='toggle-pass'){const input=document.getElementById(b.dataset.target);if(input){input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Hiện':'Ẩn'}}else if(action==='teacher-tab'){teacherTab=b.dataset.tab;selectedAttempt=null;renderTeacher();window.scrollTo(0,0)}else if(action==='view-attempt'){selectedAttempt=b.dataset.id;renderTeacher();document.querySelector('.detail-title')?.scrollIntoView()}else if(action==='close-attempt'){selectedAttempt=null;renderTeacher()}else if(action==='export-excel')exportExcel();else if(action==='download-receipt'){const a=attempts().find(x=>x.id===b.dataset.id);if(a)downloadReceipt(a)}else if(action==='backup-data')exportBackup();else if(action==='recover-receipt')recoverReceipt();else if(action==='copy-room-link'){const link=roomLink();if(link){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>alert('Đã sao chép link phòng thi.')).catch(()=>prompt('Sao chép liên kết:',link))}else prompt('Sao chép liên kết:',link)}}else if(action==='candidate-fill')fillCandidates();else if(action==='save-essay-mark'){const all=attempts(),a=all.find(x=>x.id===b.dataset.aid),q=QUESTION_BY_ID[b.dataset.qid];if(!a||!q)return;const inp=document.querySelector('[data-manual="'+b.dataset.qid+'"]');const val=inp?.value;if(!validation(q)||!finiteNonnegative(val)||Number(val)>Number(rubric[q.id].points)){alert('Cần cấu hình điểm tối đa trước và nhập điểm trong giới hạn.');return}a.manualGrades=a.manualGrades||{};a.manualGrades[q.id]=Number(val);saveJSON(STORAGE.attempts,all);renderTeacher()}
});
document.addEventListener('submit',async e=>{if(!['studentStartForm','teacherLoginForm','passwordForm','settingsForm','rubricForm'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='studentStartForm'){if(!Number(settings.duration)){alert('Giáo viên phải cài đặt số phút trước.');return}if(draft&&!confirm('Đang có bài làm chưa nộp. Bắt đầu bài mới sẽ thay thế bản lưu nháp. Tiếp tục?'))return;const name=document.getElementById('studentName').value.trim(),cls=document.getElementById('studentClass').value.trim();if(!name||!cls)return;draft=newDraft(name,cls);draftSave();route='studentExam';render()}else if(e.target.id==='teacherLoginForm')await loginPass(e);else if(e.target.id==='passwordForm')await changePass(e);else if(e.target.id==='settingsForm'){const f=e.target;const duration=f.elements.namedItem('duration').value;if(duration&&(!Number.isInteger(Number(duration))||Number(duration)<1||Number(duration)>1000)){alert('Thời gian phải là số phút nguyên từ 1 đến 1000.');return}settings={...settings,school:f.elements.namedItem('school').value.trim(),teacher:f.elements.namedItem('teacher').value.trim(),exam:f.elements.namedItem('exam').value.trim(),duration,shuffleQuestions:f.elements.namedItem('shuffleQuestions').checked,shuffleOptions:f.elements.namedItem('shuffleOptions').checked};try{saveJSON(STORAGE.settings,settings);renderTeacher();alert('Đã lưu cài đặt trong trình duyệt này.')}catch(ex){alert('Không thể lưu cài đặt: '+ex.message)}}else if(e.target.id==='rubricForm'){rubric=extractRubric();try{saveJSON(STORAGE.rubric,rubric);renderTeacher();alert('Đã lưu đáp án và biểu điểm do giáo viên nhập. Chỉ câu đã đủ dữ liệu mới được chấm.')}catch(ex){alert('Không thể lưu biểu điểm: '+ex.message)}}});
document.addEventListener('input',e=>{if(route!=='studentExam'||!draft)return;const q=currentQuestion(),t=e.target;if((t.id==='shortAnswer'||t.id==='essayAnswer')&&t.dataset.question===q.id){draft.answers[q.id]=t.value;draftSave()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='importAttemptFiles'){importReceiptFiles(t.files);return}if(t.id==='restoreBackupFile'){restoreBackup(t.files?.[0]);return}if(t.id==='logoFile'){uploadLogo(t.files?.[0]);return}if(t.dataset.mode){const a=t.dataset.mode;document.querySelector('[data-points-mode="'+a+'"]').classList.toggle('hide',t.value==='by_count');document.querySelector('[data-count-mode="'+a+'"]').classList.toggle('hide',t.value!=='by_count');return}if(route!=='studentExam'||!draft)return;const q=currentQuestion();if(t.name==='mcanswer')draft.answers[q.id]=t.value;else if(t.name?.startsWith('tf_'))draft.answers[q.id+'_'+t.name.slice(3)]=t.value;else if(t.id==='flagCurrent')draft.flags[q.id]=t.checked;else return;draftSave();renderExam()});
document.addEventListener('input',e=>{if(e.target.id==='studentFilter'){const v=e.target.value.trim().toLocaleLowerCase('vi');document.querySelectorAll('[data-row-name]').forEach(row=>row.hidden=!row.dataset.rowName.includes(v))}});
setInterval(clockTick,1000);
if(draft&&Date.now()>=draft.endAt){route='studentExam';finish(true)}else {const portal=new URLSearchParams(location.search).get('portal');if(portal==='teacher')route='teacherLogin';else if(portal==='student')route='studentStart';render()}
</script>
